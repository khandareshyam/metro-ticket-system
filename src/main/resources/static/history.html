<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey History</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="top-bar">
    <div class="logo-box">
        <img src="/images/pune-metro-logo.png" alt="Pune Metro Logo">

        <div class="metro-logo">
            <div class="title">PUNE METRO</div>
            <div class="subtitle">Journey History</div>
        </div>
    </div>
</header>

<main class="container">

    <section class="card">

        <h2>My Tickets</h2>

        <table style="width:100%">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>From</th>
                    <th>To</th>
                    <th>Fare</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="historyBody">
            </tbody>
        </table>

        <br>

        <button
            class="primary-btn"
            onclick="location.href='dashboard.html'">
            Back To Dashboard
        </button>

    </section>

</main>

<footer>
    © Maha Metro – Pune Metro Rail Corporation
</footer>

<script>

fetch("/api/tickets/my-tickets", {
    credentials: "include"
})
.then(r => r.json())
.then(data => {

    const body =
        document.getElementById("historyBody");

    body.innerHTML = "";

    data.forEach(t => {

        body.innerHTML += `
        <tr>
            <td>${t.id}</td>
            <td>${t.fromStation}</td>
            <td>${t.toStation}</td>
            <td>₹${t.fare}</td>
            <td>${t.status}</td>
        </tr>`;
    });
});

</script>

</body>
</html>
