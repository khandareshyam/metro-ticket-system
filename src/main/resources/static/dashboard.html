<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pune Metro Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="top-bar">
    <div class="logo-box">
        <img src="/images/pune-metro-logo.png" alt="Pune Metro Logo">

        <div class="metro-logo">
            <div class="title">PUNE METRO</div>
            <div class="subtitle">Passenger Dashboard</div>
        </div>
    </div>
</header>

<main class="container">

    <section class="card">

        <h2>Welcome to Pune Metro</h2>

        <p>
            Book tickets, view journey history and manage your metro travel.
        </p>

        <br>

        <button
            class="primary-btn"
            onclick="location.href='booking.html'">
            Book New Ticket
        </button>

        <br><br>

        <button
            class="secondary-btn"
            onclick="location.href='history.html'">
            Journey History
        </button>

        <br><br>

        <button
            class="secondary-btn"
            onclick="location.href='index.html'">
            Logout
        </button>

    </section>

</main>

<footer>
    © Maha Metro – Pune Metro Rail Corporation
</footer>

</body>
</html>
